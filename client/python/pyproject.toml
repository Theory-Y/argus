[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theory-y"
version = "1.0.0"
description = "Official client for the TheoryY Research API — institutional equity memos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.scripts]
theory-y = "theory_y.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["theory_y*"]
