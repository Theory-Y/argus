# Local dev / self-host stack for the TheoryY service.
#
#   docker compose -f infra/docker-compose.yml up --build
#
# License mode (AUTH_MODE=license) with SQLite + local storage + the in-process
# queue — zero external services. Uncomment the postgres/redis blocks to scale.

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      AUTH_MODE: ${AUTH_MODE:-license}
      # Engine data sources (see repo README for how to obtain these):
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-TheoryY/1.0 ops@example.com}
      # Memo generation:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      # License mode: leave LICENSE_SECRET empty for open self-host.
      LICENSE_SECRET: ${LICENSE_SECRET:-}
      # Persistence + storage (SQLite + local disk by default):
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/theoryy_service.db}
      STORAGE_DIR: /data/memos
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Optional scale-out (defaults shown above are fine for self-host):
      # STORAGE_BACKEND=s3, S3_BUCKET, S3_REGION, QUEUE_BACKEND=rq, REDIS_URL
    volumes:
      - theoryy_data:/data

  # ── Scale extras (uncomment for postgres/redis at scale) ───────────────────
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: theoryy
  #     POSTGRES_PASSWORD: theoryy
  #     POSTGRES_DB: theoryy
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #
  # redis:
  #   image: redis:7

volumes:
  theoryy_data:
  # pg_data:
